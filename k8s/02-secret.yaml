# Demo-grade secrets with placeholders — edit before applying (README §k8s):
# set OPENAI_API_KEY (required; structured-output needs a NON-thinking model),
# and LANGFUSE_* keys if you want traces. kubectl create secret works equally.
apiVersion: v1
kind: Secret
metadata:
  name: clinicpilot-secrets
  namespace: clinicpilot
type: Opaque
stringData:
  POSTGRES_USER: clinicpilot
  POSTGRES_PASSWORD: clinicpilot
  POSTGRES_DB: clinicpilot
  OPENAI_API_KEY: ""
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""
