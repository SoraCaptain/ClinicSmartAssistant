# One origin: /api → backend, / → frontend (DESIGN §9). Requires an ingress
# controller (e.g. `minikube addons enable ingress`); map clinicpilot.local in
# /etc/hosts to the ingress LB/IP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clinicpilot
  namespace: clinicpilot
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120" # LLM turns can be slow
spec:
  ingressClassName: nginx
  rules:
    - host: clinicpilot.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
