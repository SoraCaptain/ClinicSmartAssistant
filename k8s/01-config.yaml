# Non-secret configuration shared by backend + ai-service (DESIGN §9).
apiVersion: v1
kind: ConfigMap
metadata:
  name: clinicpilot-config
  namespace: clinicpilot
data:
  BACKEND_URL: http://backend:8000
  AI_SERVICE_URL: http://ai:8001
  DEFAULT_PATIENT_ID: P001
  OPENAI_BASE_URL: https://api.openai.com/v1
  LLM_MODEL: gpt-4o-mini
  # Langfuse is optional (P6): empty keys → tracing off
  LANGFUSE_HOST: ""
