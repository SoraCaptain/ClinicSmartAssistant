# ai-service — stateless over REST tools (P3); single replica because the demo
# checkpointer is in-process (MemorySaver, DESIGN §5.2). Readiness /health gates
# on backend reachability (DESIGN §9); liveness is /livez (process-only) so a
# backend outage degrades without restarting the pod and its conversation state.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: clinicpilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      containers:
        - name: ai
          image: clinicpilot/ai:latest
          imagePullPolicy: IfNotPresent # :latest defaults to Always; image is node-local
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: clinicpilot-config
            - secretRef:
                name: clinicpilot-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai
  namespace: clinicpilot
spec:
  selector:
    app: ai
  ports:
    - port: 8001
      targetPort: 8001
