# frontend — the API base is baked into the client bundle at image build time
# (Makefile k8s-build passes NEXT_PUBLIC_API_URL=http://clinicpilot.local).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: clinicpilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: clinicpilot/frontend:latest
          imagePullPolicy: IfNotPresent # :latest defaults to Always; image is node-local
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: clinicpilot
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
