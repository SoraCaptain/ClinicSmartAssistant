[project]
name = "clinicpilot-backend"
version = "0.1.0"
description = "ClinicPilot AI — API + persistence service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    'ignore:Dialect sqlite\+pysqlite \*does not\* support Decimal:sqlalchemy.exc.SAWarning',
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
