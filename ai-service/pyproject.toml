[project]
name = "clinicpilot-ai"
version = "0.1.0"
description = "ClinicPilot AI — LLM orchestration service (LangGraph)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.4",
    "langfuse>=4,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
